# IMPORTANT:
# - All active legacy filter/calibration chains were discovered and represented.
# - A window holds each accepted reading in force until the next one and
#   publishes once per period. `mean` (the default) is time-weighted, like
#   Home Assistant's time_simple_moving_average; `latest` is the reading in
#   force when the period ends. Omitting `window` publishes every reading.
# - The first value is published at once (current reading, else the value
#   restored from before the restart); a window never delays it.
# - By default the sensor is unavailable/unknown while its source is
#   (`availability: {follow_source: false}` keeps the last value instead).
# - `value_limits` rejects out-of-range raw readings by default. The pool
#   sensors use `mode: clamp` to match the legacy `range` filter.
#
signal_conditioner:
  attic_temperature:
    source: sensor.attic_inkbird_temperature
    value_limits:
      minimum: 20
      maximum: 180
    calibration:
      data_points:
      - [ 77.1, 76.1 ]
      - [ 87.1, 86.1 ]
    window:
      duration: 60
    rounding:
      precision: 2

  attic_relative_humidity:
    source: sensor.attic_inkbird_humidity
    value_limits:
      minimum: 0
      maximum: 100
    calibration:
      data_points:
      - [ 53.87, 53.35 ]
      - [ 63.87, 63.35 ]
    window:
      duration: 60
    rounding:
      precision: 1

